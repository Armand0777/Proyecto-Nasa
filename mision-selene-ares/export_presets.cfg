html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<script>
// Celulares y tablets: al tocar la pantalla, el juego pasa a pantalla completa (sin la barra del
// navegador) y queda acostado. Si el jugador sale (gesto atrás), el próximo toque vuelve a entrar.
// En iPhone el navegador no deja: ahí se juega a pantalla completa agregando la página a la
// pantalla de inicio (para eso es la etiqueta de arriba).
(function () {
	var movil = matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
	var raiz = document.documentElement;
	var pedir = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
	if (!movil || !pedir) {
		return;
	}
	var pidiendo = false;
	function pantallaCompleta() {
		if (pidiendo || document.fullscreenElement || document.webkitFullscreenElement) {
			return;
		}
		var pedido;
		try {
			pedido = pedir.call(raiz, { navigationUI: 'hide' });
		} catch (error) {
			return;
		}
		pidiendo = true;
		Promise.resolve(pedido).then(function () {
			if (screen.orientation && screen.orientation.lock) {
				return screen.orientation.lock('landscape');
			}
		}).catch(function () {}).then(function () {
			pidiendo = false;
		});
	}
	window.addEventListener('pointerup', pantallaCompleta, true);
	window.addEventListener('touchend', pantallaCompleta, true);
}());
</script>"
html/canvas_resize_policy=2
